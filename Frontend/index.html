<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Receipt Tracker</title>
    <!-- CDN Links -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom styles and animations -->
    <style>
        .receipt-preview-image { max-height: 400px; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loading-spinner-animation { animation: rotation 1s linear infinite; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6 md:p-8">
    <div class="container mx-auto">
        <!-- Main Application Container -->
        <!-- CHANGE: max-w-lg is removed from here and applied to the inner sections -->
        <main class="mx-auto" id="app-container">
            <!-- This inner div now centers the initial upload content -->
            <div id="initial-upload-wrapper" class="max-w-lg mx-auto">
                <!-- Upload Screen -->
                <div id="uploadSection" class="bg-white rounded-lg shadow-lg p-8 text-center">
                    <i class="fas fa-receipt text-blue-600 text-5xl mb-4"></i>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Smart Receipt Tracker</h1>
                    <p class="text-gray-600 mb-6">Select an image file to begin analyzing your receipt.</p>
                    <label for="imageInput" class="w-full inline-block px-6 py-3 rounded-lg font-semibold transition-colors duration-200 bg-blue-600 text-white hover:bg-blue-700 cursor-pointer">
                        <i class="fas fa-image mr-2"></i>Choose Image File
                    </label>
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                </div>

                <!-- User Message/Error Display -->
                <div id="messageSection" class="hidden p-4 my-4 text-sm rounded-lg"></div>

                <!-- Preview Screen -->
                <div id="previewSection" class="hidden bg-white rounded-lg shadow-lg p-6 my-6 animate-fade-in">
                    <h3 class="text-xl font-semibold mb-4 text-center">Preview</h3>
                    <div class="flex flex-col items-center">
                        <img id="previewImage" class="max-w-full h-auto rounded-lg mb-4 border receipt-preview-image" alt="Preview of the receipt to be uploaded">
                        <div class="flex space-x-4">
                            <button data-action="submit-receipt" class="px-6 py-2 rounded-lg font-semibold transition-colors duration-200 bg-green-600 text-white hover:bg-green-700"><i class="fas fa-upload mr-2"></i>Process Receipt</button>
                            <button data-action="clear-preview" class="px-6 py-2 rounded-lg font-semibold transition-colors duration-200 bg-gray-500 text-white hover:bg-gray-600"><i class="fas fa-trash mr-2"></i>Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Loading Screen -->
                <div id="loadingSection" class="hidden bg-white rounded-lg shadow-lg p-8 my-6 text-center animate-fade-in">
                    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full inline-block loading-spinner-animation"></div>
                    <h3 class="text-xl font-semibold mt-4 mb-2">Processing Receipt...</h3>
                    <p class="text-gray-600">Please wait while we analyze your receipt.</p>
                </div>
            </div>

            <!-- Receipt List Section -->
            <!-- CHANGE: This now sits directly inside the main container, allowing it to be wider -->
            <div id="receiptListSection" class="hidden bg-white rounded-lg shadow-lg p-4 sm:p-6 my-6 animate-fade-in mx-auto max-w-4xl">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                    <h3 class="text-xl font-semibold">My Processed Receipts</h3>
                    <button data-action="delete-selected" class="hidden w-full sm:w-auto px-4 py-2 rounded-lg font-semibold transition-colors duration-200 bg-red-600 text-white hover:bg-red-700">
                        <i class="fas fa-trash-alt mr-2"></i>Delete Selected
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="p-4 text-left">
                                    <input type="checkbox" 
                                    id="selectAllCheckbox" 
                                    data-action="select-all" 
                                    class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" 
                                    aria-label="Select all receipts">
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Merchant</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="receiptsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- JavaScript will insert receipt rows here -->
                        </tbody>
                    </table>
                    <div id="noReceiptsMessage" class="hidden text-center py-10">
                        <i class="fas fa-folder-open text-4xl text-gray-400 mb-4"></i>
                        <p class="text-gray-500">You haven't processed any receipts yet.</p>
                    </div>
                </div>
            </div>
            
        </main>
    </div>
    
    <!-- JavaScript files (config.js must be first) -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
